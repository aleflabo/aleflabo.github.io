name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sanity chiama qui quando una nota viene pubblicata o modificata: il sito
  # è statico e non saprebbe altrimenti che il contenuto è cambiato. Il
  # webhook si configura nello Studio (API → Webhooks) come POST a
  # https://api.github.com/repos/aleflabo/aleflabo.github.io/dispatches con
  # {"event_type":"nota-pubblicata"} e un token con permesso sui workflow.
  repository_dispatch:
    types: [nota-pubblicata]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
