<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1B263B;
            --primary-light: #415A77;
            --accent: #0D1B2A;
            --secondary: #778DA9;
            --highlight: #E0E1DD;
            --text-primary: #0D1B2A;
            --text-secondary: #415A77;
            --text-muted: #778DA9;
            --bg: #ffffff;
            --bg-secondary: #F8F9FA;
            --border: #E9ECEF;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 2rem;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 4rem;
            align-items: center;
        }

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .description {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(27, 38, 59, 0.25);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(27, 38, 59, 0.25);
            border: 3px solid var(--highlight);
        }

        .hero-image-mobile {
            display: none;
        }

        section {
            padding: 3rem 0;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
        }

        .experience-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .experience-card {
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            transition: transform 0.3s ease;
        }

        .experience-card:hover {
            transform: translateY(-5px);
        }

        .experience-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .company {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .period {
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 1rem;
        }

        .publications {
            background: var(--bg-secondary);
        }

        .publications-list {
            max-width: 900px;
            margin: 0 auto;
        }

        .publication {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.3s ease;
        }

        .publication:last-child {
            border-bottom: none;
        }

        .publication:hover {
            background: rgba(27, 38, 59, 0.02);
            padding-left: 1rem;
            padding-right: 1rem;
            margin-left: -1rem;
            margin-right: -1rem;
            border-radius: 8px;
        }

        .pub-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .pub-authors {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-style: italic;
            font-size: 1rem;
        }

        .pub-venue {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .pub-description {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .blog-list {
            max-width: 800px;
            margin: 0 auto;
        }

        .blog-post {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.3s ease;
        }

        .blog-post:last-child {
            border-bottom: none;
        }

        .blog-post:hover {
            background: rgba(27, 38, 59, 0.02);
            padding-left: 1rem;
            padding-right: 1rem;
            margin-left: -1rem;
            margin-right: -1rem;
            border-radius: 8px;
        }

        .post-date {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .post-title {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .post-title a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .post-title a:hover {
            color: var(--primary);
        }

        .post-excerpt {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .read-more {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .read-more:hover {
            color: var(--accent);
        }

        #contact {
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .social-link {
            font-size: 2.5rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            transform: scale(1.2);
        }

        footer {
            background: var(--text-primary);
            color: var(--bg);
            padding: 2rem 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 1rem;
                display: block;
            }
            
            .hero {
                min-height: auto;
                padding-top: 60px;
                padding-bottom: 1rem;
            }
            
            .hero h1 {
                font-size: 2.5rem;
                margin-bottom: 1rem;
            }
            
            .hero-image {
                display: none;
            }
            
            .hero-image-mobile {
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 20px 0;
            }
            
            .hero-image-mobile img {
                width: 180px;
                height: 180px;
                object-fit: cover;
                border-radius: 50%;
                box-shadow: 0 10px 25px rgba(27, 38, 59, 0.25);
                border: 3px solid var(--highlight);
            }
            
            .subtitle {
                margin-bottom: 1rem;
            }
            
            .description {
                margin-bottom: 2rem;
            }
            
            .cta-buttons {
                justify-content: center;
            }
            
            .nav-links {
                display: none;
            }
            
            .container {
                padding: 0 1rem;
            }
            
            .experience-grid {
                grid-template-columns: 1fr;
            }
            
            section {
                padding: 2rem 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="/" class="logo">{{ site.name }}</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/blog">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</p>
        </div>
    </footer>
</body>
</html>
