---

<div class="bibliography-item" style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.1); border-radius: 8px; text-align: left;">
  <div style="font-weight: 600; margin-bottom: 0.5rem; color: white;">
    {{ entry.title }}
  </div>
  <div style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 0.5rem;">
    {{ entry.author }} • {{ entry.journal }} • {{ entry.year }}
  </div>
  {% if entry.abstract %}
  <div style="font-size: 0.9rem; opacity: 0.7; line-height: 1.4;">
    {{ entry.abstract | truncate: 200 }}
  </div>
  {% endif %}
  {% if entry.arxiv %}
  <div style="margin-top: 0.5rem;">
    <a href="https://arxiv.org/abs/{{ entry.arxiv }}" target="_blank" style="color: #4fc3f7; text-decoration: none; font-size: 0.9rem;">
      <i class="fas fa-external-link-alt"></i> arXiv
    </a>
  </div>
  {% endif %}
</div>
